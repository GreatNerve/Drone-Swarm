[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmflow"
version = "0.1.0"
description = "Target following, obstacle avoidance, and formation recovery benchmark"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<2", "pettingzoo>=1.24,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
swarmflow = "swarmflow.cli:main"
swarmv2 = "swarmv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmflow = ["web/*.html", "web/*.js", "web/*.css"]
swarmv2 = ["viewer/web/*.html", "viewer/web/*.js", "viewer/web/*.css", "viewer/web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
